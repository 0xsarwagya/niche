name: Niche
options:
  bundleIdPrefix: com.niche
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Niche:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Vendor/mediaremote-adapter
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Niche
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Niche contributors. MIT licensed."
        NSLocationWhenInUseUsageDescription: "Niche uses your location to show local weather in the notch."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niche.app
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.niche.app.debug

  NicheTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Niche
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niche.tests
        GENERATE_INFOPLIST_FILE: YES
